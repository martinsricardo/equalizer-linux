<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2430"/>
      <stop offset="100%" stop-color="#0f1217"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#3a86ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#2d3748" stroke-width="2"/>

  <!-- Vertical track lines -->
  <line x1="28" y1="28" x2="28" y2="100" stroke="#263040" stroke-width="4" stroke-linecap="round"/>
  <line x1="46" y1="28" x2="46" y2="100" stroke="#263040" stroke-width="4" stroke-linecap="round"/>
  <line x1="64" y1="28" x2="64" y2="100" stroke="#263040" stroke-width="4" stroke-linecap="round"/>
  <line x1="82" y1="28" x2="82" y2="100" stroke="#263040" stroke-width="4" stroke-linecap="round"/>
  <line x1="100" y1="28" x2="100" y2="100" stroke="#263040" stroke-width="4" stroke-linecap="round"/>

  <!-- Active colored track segments -->
  <line x1="28" y1="64" x2="28" y2="40" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round"/>
  <line x1="46" y1="64" x2="46" y2="52" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="64" y2="76" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round"/>
  <line x1="82" y1="64" x2="82" y2="44" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round"/>
  <line x1="100" y1="64" x2="100" y2="34" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round"/>

  <!-- Center zero dB line -->
  <line x1="20" y1="64" x2="108" y2="64" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Fader Handles / Knobs -->
  <!-- 1st Knob -->
  <rect x="20" y="34" width="16" height="12" rx="4" fill="#00d2ff" filter="url(#glow)"/>
  <rect x="23" y="38" width="10" height="4" rx="1.5" fill="#ffffff"/>

  <!-- 2nd Knob -->
  <rect x="38" y="46" width="16" height="12" rx="4" fill="#00d2ff"/>
  <rect x="41" y="50" width="10" height="4" rx="1.5" fill="#ffffff"/>

  <!-- 3rd Knob -->
  <rect x="56" y="70" width="16" height="12" rx="4" fill="#3a86ff"/>
  <rect x="59" y="74" width="10" height="4" rx="1.5" fill="#ffffff"/>

  <!-- 4th Knob -->
  <rect x="74" y="38" width="16" height="12" rx="4" fill="#00d2ff"/>
  <rect x="77" y="42" width="10" height="4" rx="1.5" fill="#ffffff"/>

  <!-- 5th Knob -->
  <rect x="92" y="28" width="16" height="12" rx="4" fill="#00d2ff" filter="url(#glow)"/>
  <rect x="95" y="32" width="10" height="4" rx="1.5" fill="#ffffff"/>
</svg>

